<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пример подписей — Школа Током</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px 16px 40px;
      color: #18181b;
    }
    .wrap { max-width: 430px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .lead { margin: 0 0 16px; font-size: 14px; color: #71717a; }
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
      border: 1px solid rgba(17,17,19,0.06);
    }
    img { display: block; width: 100%; height: auto; }
    .chip {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      border: 1px solid rgba(17,17,19,0.08);
      background: rgba(255,255,255,0.92);
      padding: 6px 12px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(17,17,19,0.08);
    }
    .t { font-size: 12px; font-weight: 600; color: #18181b; line-height: 1; }
    .n { margin-top: 4px; font-size: 11px; color: #71717a; line-height: 1; }
    figcaption {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Пример подписей на картинке</h1>
    <p class="lead">Первый урок, 1 класс — «Электричество как вода». Оплачивать курс не нужно.</p>
    <figure>
      <div class="card">
        <img src="/school/water-analogy.png" alt="Насос, труба и кран" />
        <div class="chip" style="left:22%;top:62%">
          <div class="t">Насос</div>
          <div class="n">U, вольты</div>
        </div>
        <div class="chip" style="left:50%;top:28%">
          <div class="t">труба = провод</div>
          <div class="n">сопротивление</div>
        </div>
        <div class="chip" style="left:78%;top:58%">
          <div class="t">Ток I</div>
          <div class="n">амперы</div>
        </div>
      </div>
      <figcaption>Насос — вольты, поток — амперы, труба — сопротивление провода.</figcaption>
    </figure>
  </div>
</body>
</html>
