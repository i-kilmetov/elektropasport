# nginx reverse-proxy → Vercel (runs behind Amvera HTTPS ingress on :80)
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 25m;

  # AI analyze-panel can take up to ~60s
  proxy_connect_timeout 60s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ''      $host;
  }

  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      https;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_http_version 1.1;
      proxy_pass https://elektropasport.vercel.app;

      proxy_ssl_server_name on;
      proxy_ssl_name elektropasport.vercel.app;

      # Vercel project must still have www.tokom.ru attached
      proxy_set_header Host www.tokom.ru;

      # Preserve the hostname the user typed (tokom.ru / www / test)
      proxy_set_header X-Forwarded-Host $fwd_host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
