# Edge reverse-proxy in Russia → Vercel origin
#
# Users in RF hit tokom.ru on this VPS (Russian IP).
# Nginx terminates TLS and proxies to elektropasport.vercel.app.
# App stays on Vercel; no migration required.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name tokom.ru www.tokom.ru test.tokom.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tokom.ru www.tokom.ru;

    ssl_certificate     /etc/letsencrypt/live/tokom.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokom.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Panel photos / analyze-panel payloads
    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_pass https://elektropasport.vercel.app;

        # SNI to Vercel; Host = public domain (must be attached in Vercel project)
        proxy_ssl_server_name on;
        proxy_ssl_name elektropasport.vercel.app;
        proxy_set_header Host www.tokom.ru;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # AI / Robokassa / Telegram can be slow
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Optional staging — same Vercel deployment, password gate in middleware
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.tokom.ru;

    ssl_certificate     /etc/letsencrypt/live/tokom.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokom.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_pass https://elektropasport.vercel.app;
        proxy_ssl_server_name on;
        proxy_ssl_name elektropasport.vercel.app;
        proxy_set_header Host test.tokom.ru;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
